<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 400' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Nibble-serial addition</title><rect width='1200' height='400' rx='16' fill='#0b0e14'/><text x='600' y='42' fill='#e9ecef' font-size='24' font-weight='700' text-anchor='middle'>How the core adds: 4 bits per clock, 8 clocks per instruction</text><text x='600' y='68' fill='#8b949e' font-size='14' text-anchor='middle'>0x1234ABCD + 0x0FED5432 — one 4-bit adder, the carry held in a flip-flop between clocks</text><rect x='70' y='100' width='120' height='230' rx='12' fill='#161b22' stroke='#8a5cff' stroke-width='2'/><text x='130' y='126' fill='#8b949e' font-size='13' text-anchor='middle'>clock 0</text><text x='130' y='166' fill='#4f8cff' font-size='24' font-family='monospace' text-anchor='middle'>D</text><text x='130' y='198' fill='#90be6d' font-size='24' font-family='monospace' text-anchor='middle'>+2</text><text x='130' y='222' fill='#8b949e' font-size='12' text-anchor='middle'>carry in 0</text><line x1='90' y1='236' x2='170' y2='236' stroke='#30363d'/><text x='130' y='270' fill='#e9ecef' font-size='28' font-weight='700' font-family='monospace' text-anchor='middle'>F</text><text x='130' y='300' fill='#8b949e' font-size='12' text-anchor='middle'>carry out 0</text><text x='198' y='220' fill='#30363d' font-size='18'>›</text><rect x='205' y='100' width='120' height='230' rx='12' fill='#161b22' stroke='#30363d' stroke-width='2'/><text x='265' y='126' fill='#8b949e' font-size='13' text-anchor='middle'>clock 1</text><text x='265' y='166' fill='#4f8cff' font-size='24' font-family='monospace' text-anchor='middle'>C</text><text x='265' y='198' fill='#90be6d' font-size='24' font-family='monospace' text-anchor='middle'>+3</text><text x='265' y='222' fill='#8b949e' font-size='12' text-anchor='middle'>carry in 0</text><line x1='225' y1='236' x2='305' y2='236' stroke='#30363d'/><text x='265' y='270' fill='#e9ecef' font-size='28' font-weight='700' font-family='monospace' text-anchor='middle'>F</text><text x='265' y='300' fill='#8b949e' font-size='12' text-anchor='middle'>carry out 0</text><text x='333' y='220' fill='#30363d' font-size='18'>›</text><rect x='340' y='100' width='120' height='230' rx='12' fill='#161b22' stroke='#30363d' stroke-width='2'/><text x='400' y='126' fill='#8b949e' font-size='13' text-anchor='middle'>clock 2</text><text x='400' y='166' fill='#4f8cff' font-size='24' font-family='monospace' text-anchor='middle'>B</text><text x='400' y='198' fill='#90be6d' font-size='24' font-family='monospace' text-anchor='middle'>+4</text><text x='400' y='222' fill='#8b949e' font-size='12' text-anchor='middle'>carry in 0</text><line x1='360' y1='236' x2='440' y2='236' stroke='#30363d'/><text x='400' y='270' fill='#e9ecef' font-size='28' font-weight='700' font-family='monospace' text-anchor='middle'>F</text><text x='400' y='300' fill='#8b949e' font-size='12' text-anchor='middle'>carry out 0</text><text x='468' y='220' fill='#30363d' font-size='18'>›</text><rect x='475' y='100' width='120' height='230' rx='12' fill='#161b22' stroke='#30363d' stroke-width='2'/><text x='535' y='126' fill='#8b949e' font-size='13' text-anchor='middle'>clock 3</text><text x='535' y='166' fill='#4f8cff' font-size='24' font-family='monospace' text-anchor='middle'>A</text><text x='535' y='198' fill='#90be6d' font-size='24' font-family='monospace' text-anchor='middle'>+5</text><text x='535' y='222' fill='#8b949e' font-size='12' text-anchor='middle'>carry in 0</text><line x1='495' y1='236' x2='575' y2='236' stroke='#30363d'/><text x='535' y='270' fill='#e9ecef' font-size='28' font-weight='700' font-family='monospace' text-anchor='middle'>F</text><text x='535' y='300' fill='#8b949e' font-size='12' text-anchor='middle'>carry out 0</text><text x='603' y='220' fill='#30363d' font-size='18'>›</text><rect x='610' y='100' width='120' height='230' rx='12' fill='#161b22