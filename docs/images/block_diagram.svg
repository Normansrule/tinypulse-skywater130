<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 560' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>TinyPulse block diagram</title><rect width='1200' height='560' rx='16' fill='#0b0e14'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0L10,5L0,10z' fill='#8b949e'/></marker></defs><text x='600' y='44' fill='#e9ecef' font-size='26' font-weight='700' text-anchor='middle'>Inside TinyPulse</text><rect x='60' y='90' width='300' height='150' rx='14' fill='#161b22' stroke='#8a5cff' stroke-width='3'/><text x='210.0' y='161.0' fill='#e9ecef' font-size='18' font-weight='700' text-anchor='middle'>CPU core</text><text x='210.0' y='185.0' fill='#8b949e' font-size='13' text-anchor='middle'>RV32E · 4 bits per clock · 8-clock ALU op</text><rect x='60' y='300' width='300' height='110' rx='14' fill='#161b22' stroke='#4f8cff' stroke-width='3'/><text x='210.0' y='351.0' fill='#e9ecef' font-size='18' font-weight='700' text-anchor='middle'>Register file</text><text x='210.0' y='375.0' fill='#8b949e' font-size='13' text-anchor='middle'>15 × 32 bits, rotating, 2 × 4-bit ports</text><rect x='450' y='90' width='300' height='150' rx='14' fill='#161b22' stroke='#adb5bd' stroke-width='3'/><text x='600.0' y='161.0' fill='#e9ecef' font-size='18' font-weight='700' text-anchor='middle'>Bus</text><text x='600.0' y='185.0' fill='#8b949e' font-size='13' text-anchor='middle'>address decode · data port has priority</text><rect x='840' y='60' width='300' height='110' rx='14' fill='#161b22' stroke='#ff9f1c' stroke-width='3'/><text x='990.0' y='111.0' fill='#e9ecef' font-size='18' font-weight='700' text-anchor='middle'>QSPI controller</text><text x='990.0' y='135.0' fill='#8b949e' font-size='13' text-anchor='middle'>flash + 2 RAMs · streaming fetch</text><rect x='840' y='200' width='300' height='110' rx='14' fill='#161b22' stroke='#ff5d73' stroke-width='3'/><text x='990.0' y='251.0' fill='#e9ecef' font-size='18' font-weight='700' text-anchor='middle'>Timing unit</text><text x='990.0' y='275.0' fill='#8b949e' font-size='13' text-anchor='middle'>timebase · 2 triggers · 8 captures · queue</text><rect x='840' y='340' width='300' height='110' rx='14' fill='#161b22' stroke='#90be6d' stroke-width='3'/><text x='990.0' y='391.0' fill='#e9ecef' font-size='18' font-weight='700' text-anchor='middle'>GPIO + UART</text><text x='990.0' y='415.0' fill='#8b949e' font-size='13' text-anchor='middle'>8 in · 8 out · SET/CLR/XOR · 8N1</text><line x1='210' y1='240' x2='210' y2='298' stroke='#8b949e' stroke-width='3' marker-end='url(#a)'/><text x='216.0' y='263.0' fill='#8b949e' font-size='12'>nibbles</text><line x1='360' y1='165' x2='448' y2='165' stroke='#8b949e' stroke-width='3' marker-end='url(#a)'/><text x='410.0' y='159.0' fill='#8b949e' font-size='12'>fetch / load / store</text><line x1='750' y1='130' x2='838' y2='115' stroke='#8b949e' stroke-width='3' marker-end='url(#a)'/><line x1='750' y1='190' x2='838' y2='390' stroke='#8b949e' stroke-width='3' marker-end='url(#a)'/><path d='M360 200 C 600 330, 700 255, 838 255' stroke='#ff5d73' stroke-width='3' fill='none' marker-end='url(#a)'/><text x='540' y='300' fill='#ff5d73' font-size='13'>Xpulse instructions (direct port)</text><text x='600' y='515' fill='#8b949e' font-size='14' text-anchor='middle'>0x0000_0000 flash · 0x1000_0000 RAM A · 0x1080_0000 RAM B · 0x3000_0000 GPIO/UART</text></svg>