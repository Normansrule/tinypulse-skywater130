<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 460' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>TinyPulse size comparison</title><rect width='1200' height='460' rx='16' fill='#0b0e14'/><text x='600' y='44' fill='#e9ecef' font-size='26' font-weight='700' text-anchor='middle'>How small is it?</text><text x='600' y='72' fill='#8b949e' font-size='15' text-anchor='middle'>everything drawn to the same scale · 100 µm = 110 px</text><rect x='90' y='141.664' width='368.36800000000005' height='248.336' fill='#1f2a44' stroke='#8a5cff' stroke-width='3'/><text x='274.184' y='265.832' fill='#e9ecef' font-size='17' font-weight='700' text-anchor='middle'>TinyPulse</text><text x='274.184' y='287.832' fill='#8b949e' font-size='13' text-anchor='middle'>0.335 × 0.226 mm</text><text x='274.184' y='305.832' fill='#8b949e' font-size='13' text-anchor='middle'>≈ 5,000 logic cells</text><rect x='538.368' y='140' width='77.0' height='250' fill='#b08968' opacity='.85'/><text x='576.868' y='412' fill='#e9ecef' font-size='14' text-anchor='middle'>human hair</text><text x='576.868' y='430' fill='#8b949e' font-size='12' text-anchor='middle'>~70 µm wide</text><rect x='708.368' y='60.0' width='330.0' height='330.0' rx='14' fill='#e9ecef' opacity='.9' transform='rotate(-4 873.368 225.0)'/><text x='873.368' y='412' fill='#e9ecef' font-size='14' text-anchor='middle'>grain of table salt</text><text x='873.368' y='430' fill='#8b949e' font-size='12' text-anchor='middle'>~0.3 mm</text><circle cx='1108.368' cy='382' r='5.125' fill='#ff5d73'/><text x='1108.368' y='412' fill='#e9ecef' font-size='14' text-anchor='middle'>red blood cell</text><text x='1108.368' y='430' fill='#8b949e' font-size='12' text-anchor='middle'>~7.5 µm</text><line x1='90' y1='450' x2='200' y2='450' stroke='#e9ecef' stroke-width='3'/><text x='210' y='455' fill='#8b949e' font-size='13'>100 µm</text></svg>