9999999999' y2='322' stroke='#ffd23f' stroke-width='1.5' stroke-dasharray='4 4'/><rect class='ty3' x='846.71' y='274' width='14' height='36' fill='#e5534b'/><line x1='983.0' y1='252' x2='983.0' y2='322' stroke='#ffd23f' stroke-width='1.5' stroke-dasharray='4 4'/><rect class='ty4' x='1012.26' y='274' width='14' height='36' fill='#e5534b'/><text x='290' y='350' fill='#ffd23f' font-size='13'>- - - deadlines</text><g class='cur'><line x1='290' y1='118' x2='290' y2='330' stroke='#e9ecef' stroke-width='2' opacity='.6'/></g><text x='40' y='385' fill='#8b949e' font-size='12'>TinyPulse numbers are from `make run PROG=../sw/examples/hello.c`. The lower row is a qualitative illustration, not a measurement.</text></svg>