<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 400' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Deterministic timing</title><style>@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(770px)}}.cur{animation:sweep 7s linear infinite}@keyframes Ti0{0%,14.4%{opacity:0}15.4%,97%{opacity:1}100%{opacity:0}}.Ti0{animation:Ti0 7s infinite;opacity:0}@keyframes Ti1{0%,33.4%{opacity:0}34.4%,97%{opacity:1}100%{opacity:0}}.Ti1{animation:Ti1 7s infinite;opacity:0}@keyframes Ti2{0%,52.4%{opacity:0}53.4%,97%{opacity:1}100%{opacity:0}}.Ti2{animation:Ti2 7s infinite;opacity:0}@keyframes Ti3{0%,71.4%{opacity:0}72.4%,97%{opacity:1}100%{opacity:0}}.Ti3{animation:Ti3 7s infinite;opacity:0}@keyframes Ti4{0%,90.4%{opacity:0}91.4%,97%{opacity:1}100%{opacity:0}}.Ti4{animation:Ti4 7s infinite;opacity:0}@keyframes ty0{0%,16.2%{opacity:0}17.2%,97%{opacity:1}100%{opacity:0}}.ty0{animation:ty0 7s infinite;opacity:0}@keyframes ty1{0%,33.0%{opacity:0}34.0%,97%{opacity:1}100%{opacity:0}}.ty1{animation:ty1 7s infinite;opacity:0}@keyframes ty2{0%,55.1%{opacity:0}56.1%,97%{opacity:1}100%{opacity:0}}.ty2{animation:ty2 7s infinite;opacity:0}@keyframes ty3{0%,72.3%{opacity:0}73.3%,97%{opacity:1}100%{opacity:0}}.ty3{animation:ty3 7s infinite;opacity:0}@keyframes ty4{0%,93.8%{opacity:0}94.8%,97%{opacity:1}100%{opacity:0}}.ty4{animation:ty4 7s infinite;opacity:0}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width='1100' height='400' rx='16' fill='#0b0e14'/><text x='40' y='46' fill='#e9ecef' font-size='24' font-weight='800'>Deterministic timing</text><text x='40' y='72' fill='#8b949e' font-size='15'>tp_wait(deadline) parks the core until the timebase reaches it. Every wake-up lands the same number of clocks after its deadline.</text><text x='40' y='158' fill='#e9ecef' font-size='16' font-weight='700'>TinyPulse</text><text x='40' y='178' fil