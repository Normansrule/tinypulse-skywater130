-size='16' font-weight='600'>OUT5 / HALT</text><text x='854' y='433' fill='#8b949e' font-size='12'>ECALL / EBREAK reached</text><line x1='770' y1='466' x2='840' y2='466' stroke='#3ddc97' stroke-width='4'/><circle cx='840' cy='466' r='7' fill='#3ddc97'/><text x='756' y='471' fill='#8b949e' font-size='13' text-anchor='end'>uo[6]</text><text x='854' y='467' fill='#e9ecef' font-size='16' font-weight='600'>OUT6 / ILLEGAL</text><text x='854' y='485' fill='#8b949e' font-size='12'>bad instruction seen</text><line x1='770' y1='518' x2='840' y2='518' stroke='#3ddc97' stroke-width='4'/><circle cx='840' cy='518' r='7' fill='#3ddc97'/><text x='756' y='523' fill='#8b949e' font-size='13' text-anchor='end'>uo[7]</text><text x='854' y='519' fill='#e9ecef' font-size='16' font-weight='600'>OUT7 / HEARTBEAT</text><text x='854' y='537' fill='#8b949e' font-size='12'>~3 Hz blink at 50 MHz</text><line x1='452' y1='560' x2='452' y2='620' stroke='#ff9f1c' stroke-width='4'/><circle cx='452' cy='620' r='7' fill='#ff9f1c'/><text transform='translate(457,634) rotate(55)' fill='#e9ecef' font-size='13' font-weight='600'>CS0 flash <tspan fill='#8b949e' font-weight='400' font-size='11'>uio[0]</tspan></text><line x1='494' y1='560' x2='494' y2='620' stroke='#ff9f1c' stroke-width='4'/><circle cx='494' cy='620' r='7' fill='#ff9f1c'/><text transform='translate(499,634) rotate(55)' fill='#e9ecef' font-size='13' font-weight='600'>SD0 <tspan fill='#8b949e' font-weight='400' font-size='11'>uio[1]</tspan></text><line x1='536' y1='560' x2='536' y2='620' stroke='#ff9f1c' stroke-width='4'/><circle cx='536' cy='620' r='7' fill='#ff9f1c'/><text transform='translate(541,634) rotate(55)' fill='#e9ecef' font-size='13' font-weight='600'>SD1 <tspan fill='#8b949e' font-weight='400' font-size='11'>uio[2]</tspan></text><line x1='578' y1='560' x2='578' y2='620' stroke='#ff9f1c' stroke-width='4'/><circle cx='578' cy='620' r='7' fill='#ff9f1c'/><text transform='translate(583,634) rotate(55)' fill='#e9ecef' font-size='13' fon