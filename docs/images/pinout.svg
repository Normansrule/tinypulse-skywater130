<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 760' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>TinyPulse pinout</title><rect width='1200' height='760' rx='16' fill='#0b0e14'/><text x='600' y='48' fill='#e9ecef' font-size='28' font-weight='700' text-anchor='middle'>TinyPulse pinout — 24 signals</text><text x='600' y='76' fill='#8b949e' font-size='15' text-anchor='middle'>8 inputs · 8 outputs (GPIO or built-in function, per pin) · 8 to the QSPI Pmod</text><rect x='430' y='120' width='340' height='440' rx='18' fill='#161b22' stroke='#30363d' stroke-width='3'/><text x='600' y='310' fill='#e9ecef' font-size='30' font-weight='800' text-anchor='middle'>TinyPulse</text><text x='600' y='342' fill='#8b949e' font-size='15' text-anchor='middle'>RV32E microcontroller</text><text x='600' y='366' fill='#8b949e' font-size='15' text-anchor='middle'>sky130 · 2×2 tiles · 50 MHz</text><line x1='360' y1='154' x2='430' y2='154' stroke='#4f8cff' stroke-width='4'/><circle cx='360' cy='154' r='7' fill='#4f8cff'/><text x='444' y='159' fill='#8b949e' font-size='13'>ui[0]</text><text x='346' y='155' fill='#e9ecef' font-size='16' font-weight='600' text-anchor='end'>IN0 · CAP0</text><text x='346' y='173' fill='#8b949e' font-size='12' text-anchor='end'>QSPI latency bit 0 at reset</text><line x1='360' y1='206' x2='430' y2='206' stroke='#4f8cff' stroke-width='4'/><circle cx='360' cy='206' r='7' fill='#4f8cff'/><text x='444' y='211' fill='#8b949e' font-size='13'>ui[1]</text><text x='346' y='207' fill='#e9ecef' font-size='16' font-weight='600' text-anchor='end'>IN1 · CAP1</text><text x='346' y='225' fill='#8b949e' font-size='12' text-anchor='end'>QSPI latency bit 1 at reset</text><line x1='360' y1='258' x2='430' y2='258' stroke='#4f8cff' stroke-width='4'/><circle cx='360' cy='258' r='7' fill='#4f8cff'/><text x='444' y='263' fill='#8b949e' font-size='13'>ui[2]</text><text x='346' y=